<div class="send-content request-content">
  <div class="request-tabs" data-section="request-tabs">
    <button class="request-tab request-tab--active" type="button" data-tab="request-friend">
      <svg class="request-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="#icon-request" />
      </svg>
      Send request
    </button>
    <button class="request-tab" type="button" data-tab="qr-code">
      <svg class="request-tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="#icon-qr-code" />
      </svg>
      Create QR code
    </button>
  </div>
  <div class="request-panel" data-panel="request-friend">
    <div class="content-card trust-hero send-card">
      <form class="send-form send-form--payment" aria-label="Request payment form">
        <div class="owes-sentence">
          <select class="form-select owes-sentence-select owes-sentence-select--debtor" data-bind="request-to"></select>
          <span class="form-label owes-sentence-verb">owes</span>
          <span class="owes-sentence-name owes-sentence-name--creditor" data-bind="request-preview-user-name">You</span>
          <input
            class="form-input owes-sentence-amount"
            type="number"
            inputmode="decimal"
            min="0"
            step="1"
            placeholder="0"
            data-bind="request-amount"
          />
          <span class="owes-sentence-currency">€</span>
          <span class="owes-sentence-preview owes-sentence-preview--debtor" data-bind="request-preview-debtor-amount">−€0</span>
          <span class="owes-sentence-preview owes-sentence-preview--creditor" data-bind="request-preview-creditor-amount">+€0</span>
        </div>
        <label class="form-field">
          <textarea
            class="form-textarea"
            rows="1"
            placeholder="because"
            data-bind="request-message"
          ></textarea>
        </label>
        <div class="recurrence-field" data-slot="recurrence"></div>
        <button class="primary-button" type="button" data-bind="request-submit">
          <span class="primary-button-label">Request payment</span>
        </button>
      </form>
    </div>
  </div>
  <div class="request-panel" data-panel="qr-code" hidden>
    <div class="content-card trust-hero send-card">
      <form class="send-form request-qr-form" aria-label="QR code form">
        <label class="form-field form-field-inline">
          <span class="form-label">Amount (EUR)</span>
          <input
            class="form-input"
            type="number"
            inputmode="decimal"
            min="0"
            step="1"
            placeholder="0.00"
            data-bind="qr-amount"
          />
        </label>
        <label class="form-field">
          <span class="form-label"></span>
          <textarea
            class="form-textarea"
            rows="1"
            placeholder="Add a note"
            data-bind="qr-message"
          ></textarea>
        </label>
        <div class="request-qr-display" data-bind="request-qr"></div>
      </form>
    </div>
  </div>
</div>
