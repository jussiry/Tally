<div class="send-content">
  <div class="send-scanner" data-section="send-qr-scanner" hidden>
    <div class="send-scanner-viewport" data-bind="send-qr-reader"></div>
    <button class="send-scanner-close" type="button" data-action="close-send-scanner">
      Cancel
    </button>
  </div>
  <div class="content-card trust-hero send-card">
    <form class="send-form send-form--payment" aria-label="Record tally form">
      <div class="owes-sentence">
        <span class="owes-sentence-name owes-sentence-name--debtor" data-bind="record-preview-user-name">You</span>
        <span class="form-label owes-sentence-verb">owes</span>
        <select class="form-select owes-sentence-select owes-sentence-select--creditor" data-bind="send-to"></select>
        <input
          class="form-input owes-sentence-amount"
          type="number"
          inputmode="decimal"
          min="0"
          step="1"
          placeholder="0"
          data-bind="send-amount"
        />
        <span class="owes-sentence-currency">€</span>
        <span class="owes-sentence-preview owes-sentence-preview--debtor" data-bind="record-preview-user-amount">−€0</span>
        <span class="owes-sentence-preview owes-sentence-preview--creditor" data-bind="record-preview-friend-amount">+€0</span>
      </div>
      <label class="form-field">
        <textarea
          class="form-textarea"
          rows="1"
          placeholder="because"
          data-bind="send-message"
        ></textarea>
      </label>
      <div class="recurrence-field" data-slot="recurrence"></div>
      <button class="primary-button" type="button" data-bind="send-submit">
        <svg class="primary-button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="#icon-send" />
        </svg>
        <span class="primary-button-label">Sign and send to friend</span>
      </button>
    </form>
  </div>
  <div class="explainer-card surface-box" data-bind="send-explainer">
    Add an explanation of what sending an IOU means.
  </div>
  <a class="link-record-cta surface-box" href="#send-link/send">
    <strong>Not on Tally yet?</strong>
    <span>Share a link with the record to a friend</span>
  </a>
</div>
