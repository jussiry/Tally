<div class="section">
  <h2 class="section-title">My friends</h2>
  <div class="friends-list" data-list="friends"></div>
  <div class="friends-add-inline">
    <button class="friends-add-button" type="button" data-action="add-friend" aria-label="Add a friend">
      <svg class="friends-add-button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="#icon-plus" />
      </svg>
    </button>
  </div>
  <ul class="friends-legend" aria-label="What the friend icon colours mean">
    <li class="friends-legend-item">
      <svg class="friend-icon friend-icon--online" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="#icon-person" />
      </svg>
      <span>Connected directly (peer-to-peer)</span>
    </li>
    <li class="friends-legend-item">
      <svg class="friend-icon friend-icon--relay" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="#icon-person" />
      </svg>
      <span>Connected via relay server</span>
    </li>
    <li class="friends-legend-item">
      <svg class="friend-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <use href="#icon-person" />
      </svg>
      <span>Offline</span>
    </li>
  </ul>
  <div class="friends-disabled" data-section="disabled-friends" hidden>
    <h2 class="section-title">Disabled connections</h2>
    <div class="friends-list" data-list="disabled-friends"></div>
  </div>
</div>

<template data-template="friend-item">
  <button class="friend-row surface-box" type="button">
    <div class="meta">
      <div class="friend-name">
        <svg class="friend-icon" data-bind="friend-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <use href="#icon-person" />
        </svg>
        <h3 data-bind="name"></h3>
      </div>
      <span class="action-dot" data-bind="action-dot" hidden></span>
    </div>
    <div class="amount" data-bind="amount"></div>
  </button>
</template>

<!-- Saved for later: expandable friend history UI -->
<template data-template="friend-item-detail">
  <details class="friend">
    <summary class="row">
      <div class="meta">
        <h3 data-bind="name"></h3>
      </div>
      <div class="amount" data-bind="amount"></div>
    </summary>
    <div class="tx-wrap">
      <ul class="tx-list" data-list="transactions"></ul>
    </div>
  </details>
</template>

<template data-template="tx-item">
  <li>
    <span class="tx-date" data-bind="date"></span>
    <strong class="tx-amount" data-bind="amount"></strong>
    <span class="tx-note" data-bind="note"></span>
  </li>
</template>
